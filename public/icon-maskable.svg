<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskable-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="curiangoo-wing-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background for safe area / maskable display -->
  <rect width="512" height="512" fill="url(#maskable-bg)" />

  <!-- Bird inside 80% safe zone -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Main bird head -->
    <path
      d="M260 100 C275 100 290 110 298 126 C304 138 304 152 298 164 C308 160 326 156 340 162 C342 163 336 172 324 178 C308 186 292 186 276 182 C252 176 236 156 236 132 C236 114 246 100 260 100 Z"
      fill="#FFFFFF"
    />
    <circle cx="274" cy="132" r="5" fill="#064E3B" />

    <!-- Outer wing -->
    <path
      d="M100 286 C120 200 180 134 268 116 C238 150 216 198 214 252 C212 294 228 326 248 350 C182 346 128 322 100 286 Z"
      fill="url(#curiangoo-wing-mask)"
      opacity="0.95"
    />

    <!-- Middle feather -->
    <path
      d="M136 304 C158 240 206 188 274 168 C252 196 238 234 240 278 C242 312 258 336 278 354 C224 352 168 338 136 304 Z"
      fill="#FFFFFF"
      opacity="0.85"
    />

    <!-- Inner feather -->
    <path
      d="M174 322 C200 280 240 240 300 220 C280 244 270 274 274 310 C276 332 292 352 316 364 C264 366 206 352 174 322 Z"
      fill="#D1FAE5"
      opacity="0.75"
    />

    <!-- Ascent leaf -->
    <path
      d="M296 210 C340 196 376 220 380 256 C344 264 310 244 296 210 Z"
      fill="#34D399"
    />
  </g>
</svg>
