<!-- HTML template for the frontend react app: https://developer.mozilla.org/en-US/docs/Web/HTML -->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Curiangoo — Finanças Familiares</title>
    <meta
      name="description"
      content="Curiangoo: Gestão financeira familiar simples, moderna e colaborativa com modelo 3 Baldes, acompanhamento de metas e isolamento seguro por família."
    />
    <meta name="author" content="Curiangoo" />

    <!-- PWA & Mobile Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#14213D" />
    <meta name="color-scheme" content="light" />
    <!-- ANTI-DARK: sempre claro, mesmo com o navegador em modo escuro -->
    <meta name="supported-color-schemes" content="light" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- iOS: impede zoom acidental em inputs e cortes de borda -->
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icon-maskable.svg" />

    <!-- Apple iOS Safari PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Curiangoo" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <meta property="og:title" content="Curiangoo — Finanças Familiares" />
    <meta
      property="og:description"
      content="Gestão financeira familiar colaborativa com modelo 3 baldes, metas e acompanhamento conjunto."
    />
    <meta property="og:image" content="/icon.svg" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Anti-flash: aplica light antes do React montar (evita fundo escuro em 1 frame)
      try {
        document.documentElement.classList.remove('dark')
        document.documentElement.style.colorScheme = 'light'
      } catch (e) {}
    </script>
    <!-- @skip-protected: Do not remove. Required for app features. -->
    <script src="https://goskip.dev/skip.js"></script>
    <!-- @skip-protected: Do not remove. App entrypoint. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
